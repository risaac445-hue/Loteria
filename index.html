<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lotería del Desierto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#2b1a2e; --arcilla:#8c3b2a; --arcilla-2:#b9553a; --arena:#f3d9a0; --arena-2:#e9b872;
  --oro:#ffd23f; --nopal:#2f7d4f; --cielo:#f08a4b; --papel:#fff3d6;
  --px:'Press Start 2P',ui-monospace,monospace; --txt:'VT323',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--txt);font-size:22px;color:var(--tinta);background:#7a3b4e;overflow-x:hidden}
#fondo{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.app{position:relative;z-index:1;width:min(1280px,98vw);margin:0 auto;padding:12px 10px 40px}
h1,h2,h3,.px{font-family:var(--px);font-weight:400;line-height:1.5}
/* Marco pixelado */
.caja{background:var(--papel);border:4px solid var(--tinta);box-shadow:0 0 0 4px var(--oro),8px 8px 0 4px rgba(43,26,46,.55);padding:16px}
.titulo{text-align:center;margin:6px 0 18px}
.titulo h1{margin:0;font-size:clamp(22px,5.2vw,52px);color:var(--oro);text-shadow:4px 4px 0 var(--arcilla),8px 8px 0 var(--tinta);letter-spacing:2px}
.titulo p{margin:14px 0 0;font-size:26px;color:#fff3d6;text-shadow:2px 2px 0 var(--tinta)}
/* Botones */
.btn{font-family:var(--px);font-size:12px;line-height:1.4;color:#fff;background:var(--arcilla);border:4px solid var(--tinta);padding:14px 12px;cursor:pointer;box-shadow:0 6px 0 var(--tinta);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:hover{background:var(--arcilla-2)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--tinta)}
.btn:focus-visible,.opt:focus-visible,.casilla:focus-visible{outline:4px dashed var(--oro);outline-offset:2px}
.btn.verde{background:var(--nopal)} .btn.oro{background:var(--oro);color:var(--tinta)}
.btn.grande{width:100%;font-size:16px;padding:20px}
.btn.on{background:var(--oro);color:var(--tinta)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
/* Configuración */
#configuracion .paso{margin-bottom:26px}
#configuracion h2{font-size:14px;margin:0 0 14px}
.tablas{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px}
.opt{font-family:inherit;color:var(--tinta);background:var(--arena);border:4px solid var(--tinta);padding:6px;cursor:pointer;text-align:center;font-size:20px;box-shadow:0 5px 0 var(--tinta)}
.opt img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--arena-2);image-rendering:auto}
.opt:hover{background:var(--oro)}
.opt.sel{background:var(--arcilla);color:#fff;transform:translateY(3px);box-shadow:0 2px 0 var(--tinta),0 0 0 4px var(--oro)}
.modos{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.modos .opt{padding:14px 8px;font-size:22px}
.opcion-voz{display:flex;gap:12px;flex-wrap:wrap}
/* Juego */
#juego{display:none}
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:10px 14px;background:var(--tinta);color:var(--oro);border:4px solid var(--oro)}
.hud b{font-family:var(--px);font-weight:400;font-size:13px}
.barra{flex:1 1 160px;height:18px;background:#000;border:3px solid var(--oro);position:relative;min-width:120px}
.barra i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(90deg,var(--nopal) 0 10px,#49b36f 10px 12px);transition:width .3s steps(6)}
.layout{display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr) minmax(220px,280px);gap:22px;align-items:start}
.carta-zona{position:sticky;top:12px;text-align:center}
.carta-zona h2,.panel h3{font-size:12px;margin:0 0 12px}
.carta-slot{min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;perspective:800px}
.carta-slot img{width:100%;max-width:240px;border:4px solid var(--tinta);box-shadow:0 0 0 4px var(--oro),6px 8px 0 rgba(43,26,46,.5);background:#fff;animation:voltear .6s steps(8)}
.carta-nombre{font-family:var(--px);font-size:14px;line-height:1.5;color:var(--arcilla)}
.carta-num{font-size:20px;opacity:.7}
.vacio{font-size:56px;opacity:.6}
@keyframes voltear{0%{transform:rotateY(90deg) scale(.8)}100%{transform:rotateY(0) scale(1)}}
.canta{display:inline-flex;align-items:center;gap:8px;font-size:20px;color:var(--nopal);min-height:26px}
.canta.hablando::before{content:"♪ ♫ ♪";animation:nota .5s steps(2) infinite}
@keyframes nota{50%{transform:translateY(-4px)}}
.tabla-wrap{text-align:center}
.tabla-wrap h2{font-size:clamp(14px,2.4vw,22px);margin:0 0 10px}
.aviso{min-height:34px;margin:0 auto 10px;font-size:22px;color:var(--arcilla)}
.tabla{position:relative;width:min(100%,640px);margin:0 auto;line-height:0;border:4px solid var(--tinta);box-shadow:0 0 0 4px var(--oro),8px 8px 0 4px rgba(43,26,46,.5);background:#fff}
.tabla img.base{width:100%;height:auto;display:block}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.casilla{position:relative;cursor:pointer;background:transparent;border:0;padding:0}
.casilla:hover{background:rgba(255,210,63,.28)}
.casilla.pista{animation:pista .7s steps(2) infinite}
@keyframes pista{50%{background:rgba(255,210,63,.45)}}
.frijol{position:absolute;inset:19%;width:62%;height:62%;object-fit:contain;pointer-events:none;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.45));animation:caer .25s steps(4)}
.frijol-e{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(26px,5vw,52px);pointer-events:none;animation:caer .25s steps(4)}
@keyframes caer{from{transform:translateY(-30px) scale(1.4);opacity:0}to{transform:none;opacity:1}}
.panel{padding:14px}
.panel .btn{width:100%;margin-bottom:14px;font-size:11px}
.velocidad{display:flex;align-items:center;gap:8px;margin:0 0 16px;font-size:20px}
.velocidad input{flex:1;accent-color:var(--arcilla)}
.historial{max-height:300px;overflow:auto;display:flex;flex-wrap:wrap;gap:6px}
.hi{padding:3px 8px;background:var(--arena);border:3px solid var(--tinta);font-size:19px}
/* Ganador */
#ganador{display:none;position:fixed;inset:0;z-index:50;background:rgba(43,26,46,.8);align-items:center;justify-content:center;padding:16px}
#ganador .caja{text-align:center;max-width:520px;animation:caer .4s steps(5)}
#ganador h2{font-size:clamp(22px,6vw,38px);color:var(--arcilla);margin:0 0 14px;text-shadow:3px 3px 0 var(--oro)}
#ganador p{font-size:26px;margin:0 0 20px}
.confeti{position:fixed;top:-20px;width:12px;height:12px;z-index:60;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(540deg)}}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.carta-zona{position:static}.carta-slot{min-height:300px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fondo" aria-hidden="true"></canvas>
<div class="app">
  <header class="titulo">
    <h1>LOTERÍA</h1>
    <p>del Desierto · ¡Que corra la baraja!</p>
  </header>

  <section id="configuracion" class="caja">
    <div class="paso"><h2>1 · Elige tu tabla</h2><div class="tablas" id="selectorTablas"></div></div>
    <div class="paso"><h2>2 · ¿Cómo se gana?</h2>
      <div class="modos" id="modos">
        <button class="opt sel" data-modo="llena">🏆 Tabla llena</button>
        <button class="opt" data-modo="horizontal">━ Línea horizontal</button>
        <button class="opt" data-modo="vertical">┃ Línea vertical</button>
        <button class="opt" data-modo="diagonal">╲ Esquina a esquina</button>
        <button class="opt" data-modo="cinco">🫘 Cinco frijoles</button>
      </div>
    </div>
    <div class="paso"><h2>3 · Voz del cantor</h2>
      <div class="opcion-voz">
        <button class="opt sel" data-voz="on" id="vozOn">🔊 Cantar cartas</button>
        <button class="opt" data-voz="off" id="vozOff">🔇 Sin voz</button>
      </div>
    </div>
    <button class="btn verde grande" id="btnComenzar">▶ COMENZAR PARTIDA</button>
  </section>

  <section id="juego">
    <div class="hud">
      <b id="hudTabla">TABLA 01</b>
      <div class="barra" role="progressbar" aria-label="Cartas cantadas"><i id="progreso"></i></div>
      <b><span id="contador">0</span>/54</b>
      <button class="btn oro" style="padding:8px 10px;box-shadow:0 4px 0 #000" id="btnVoz" aria-pressed="true">🔊</button>
    </div>
    <div class="layout">
      <aside class="caja carta-zona">
        <h2>Carta cantada</h2>
        <div class="carta-slot" id="cartaActual"><div class="vacio">🎴</div><div>Pulsa <b>Sacar carta</b></div></div>
        <div class="canta" id="canta"></div>
      </aside>

      <main class="tabla-wrap">
        <h2 class="px" id="tituloTabla" style="color:#fff3d6;text-shadow:3px 3px 0 var(--tinta)">Tabla 01</h2>
        <div class="aviso" id="aviso" role="status"></div>
        <div class="tabla"><img class="base" id="imagenTabla" alt="Tu tabla de lotería"><div class="grid" id="grid"></div></div>
      </main>

      <aside class="caja panel">
        <button class="btn verde" id="btnSacar">🎴 Sacar carta</button>
        <button class="btn oro" id="btnAuto">▶ Automático</button>
        <div class="velocidad">Rápido<input type="range" id="velocidad" min="2" max="10" value="5" aria-label="Segundos entre cartas">Lento</div>
        <button class="btn" id="btnRepetir">🔁 Repetir canto</button>
        <button class="btn" id="btnNueva">🔄 Nueva partida</button>
        <h3 class="px">Ya salieron</h3>
        <div class="historial" id="historial"></div>
      </aside>
    </div>
  </section>
</div>

<div id="ganador" role="dialog" aria-modal="true"><div class="caja">
  <h2>¡LOTERÍA!</h2><p id="textoGanador"></p>
  <button class="btn verde grande" id="btnCerrar">SEGUIR JUGANDO</button>
</div></div>

<script>
/* ===== CONFIGURACIÓN DE RECURSOS (GitHub) =====
   Rutas relativas a este archivo. Si tus carpetas viven en otro lugar,
   pon aquí la URL base, p. ej. "https://usuario.github.io/repo/"  */
const BASE = "";
const RUTA_CARTAS = BASE + "cartas/";   // 01.png … 54.png
const RUTA_TABLAS = BASE + "tablas/";   // 01.png … 10.png
const RUTA_AUDIOS = BASE + "audios/";   // (opcional) 01.mp3 … 54.mp3 con la voz cantada
const FRIJOL      = BASE + "frijol.png";

const CARTAS = {"01": "La tortilla", "02": "La tortilla azul", "03": "El azadón", "04": "El metate", "05": "La aguja", "06": "La petaca", "07": "El metapil", "08": "El comal", "09": "El cuchillo", "10": "El chile", "11": "El costal", "12": "Las tunas", "13": "El sombrero", "14": "Las tijeras", "15": "La barreta", "16": "La enfrijolada", "17": "El guachichil", "18": "El huipil", "19": "El pico", "20": "La frazada", "21": "La plata", "22": "El gran tunal", "23": "Los zapatos", "24": "El pinole", "25": "El preparado", "26": "El novillo", "27": "El oro", "28": "El atole", "29": "El almagre", "30": "El piloncillo", "31": "El escoplo", "32": "Los escamoles", "33": "El pulque", "34": "El arco", "35": "Las telas", "36": "El mapa", "37": "El mezcal", "38": "Los frijoles", "39": "El chuzo", "40": "El peyote", "41": "El venado", "42": "El nativo", "43": "El mezquite", "44": "El huizache", "45": "La mula", "46": "El jorongo", "47": "El garambullo", "48": "El colonche", "49": "El aguamiel", "50": "La biznaga", "51": "La cardona", "52": "La damburita", "53": "El petate", "54": "El mitote"};
const TABLAS = {"01": [["49", "52", "46", "44"], ["22", "51", "35", "11"], ["27", "33", "25", "08"], ["53", "40", "47", "28"]], "02": [["40", "36", "29", "07"], ["24", "42", "44", "13"], ["33", "19", "54", "47"], ["16", "21", "12", "38"]], "03": [["10", "39", "20", "16"], ["53", "06", "04", "19"], ["01", "14", "43", "13"], ["52", "51", "32", "23"]], "04": [["28", "08", "19", "11"], ["36", "10", "02", "51"], ["16", "34", "26", "38"], ["41", "13", "44", "17"]], "05": [["15", "05", "07", "39"], ["28", "01", "18", "06"], ["25", "12", "31", "03"], ["29", "41", "49", "27"]], "06": [["30", "47", "03", "45"], ["11", "44", "23", "18"], ["37", "48", "08", "32"], ["43", "01", "16", "50"]], "07": [["37", "42", "29", "02"], ["12", "24", "17", "33"], ["31", "54", "48", "35"], ["46", "09", "15", "25"]], "08": [["44", "32", "22", "06"], ["45", "15", "26", "34"], ["17", "40", "09", "05"], ["30", "14", "21", "50"]], "09": [["36", "52", "07", "39"], ["17", "12", "54", "30"], ["14", "42", "26", "51"], ["18", "41", "21", "25"]], "10": [["30", "17", "40", "20"], ["32", "01", "39", "42"], ["08", "22", "52", "05"], ["27", "41", "10", "26"]]};

/* ===== FONDO 8 BITS: desierto al atardecer ===== */
(function(){
  const c=document.getElementById('fondo'), x=c.getContext('2d'); const W=200,H=112; c.width=W; c.height=H;
  const r=(col,a,b,w,h)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};
  const bandas=['#3b2046','#52285a','#7a3b6b','#a14a6a','#c95c5c','#e87a4f','#f59d52','#fbc067'];
  bandas.forEach((b,i)=>r(b,0,i*9,W,10));
  for(let i=0;i<30;i++){r('#ffe9b0',(i*53)%W,(i*29)%34,1,1)}           // estrellas
  r('#ffd23f',150,52,18,18);r('#fff1a8',152,54,14,14);r('#ffd23f',148,56,2,10);r('#ffd23f',168,56,2,10); // sol
  // mesas
  const mesa=(px,w,h,col)=>{r(col,px,H-34-h,w,h);r(col,px+3,H-34-h-4,w-6,4);r('#00000022',px,H-34-h,w,2)};
  mesa(8,46,22,'#7a2f3f');mesa(60,28,14,'#6a2a44');mesa(92,56,28,'#7a2f3f');mesa(160,36,18,'#6a2a44');
  r('#d9985a',0,H-34,W,34);r('#c9854a',0,H-22,W,22);r('#b9733f',0,H-10,W,10);
  for(let i=0;i<40;i++){r('#e8b872',(i*37)%W,H-32+(i*11)%28,3,1)}
  // nopales / saguaros
  const cactus=(px,h)=>{const g='#2f7d4f',d='#1f5a38';r(g,px,H-34-h+12,5,h);r(d,px+4,H-34-h+12,1,h);
    r(g,px-5,H-34-h+22,5,3);r(g,px-5,H-34-h+16,3,9);r(g,px+5,H-34-h+28,5,3);r(g,px+8,H-34-h+22,3,9)};
  cactus(30,32);cactus(120,26);cactus(178,36);cactus(76,18);
  const nopal=(px)=>{const g='#3a9a5c';r(g,px,H-12,7,6);r(g,px+6,H-18,6,6);r(g,px-4,H-17,5,5);r('#e84a5f',px+8,H-19,2,2)};
  nopal(50);nopal(140);nopal(100);
})();

/* ===== ESTADO ===== */
let tablaSel="01", modo="llena", vozActiva=true;
let mazo=[], salidas=[], marcadas=new Set(), timer=null, activo=false, audioActual=null, ultima=null;

/* ===== VOZ: archivo .mp3 si existe; si no, el navegador lee la carta ===== */
const synth=window.speechSynthesis;
let vozES=null;
function elegirVoz(){
  if(!synth)return; const v=synth.getVoices();
  vozES=v.find(x=>/es[-_]MX/i.test(x.lang))||v.find(x=>/^es/i.test(x.lang))||null;
}
if(synth){elegirVoz();synth.onvoiceschanged=elegirVoz}
const cantaEl=document.getElementById('canta');
function fin(){cantaEl.classList.remove('hablando');cantaEl.textContent=''}
function hablar(num){
  detenerVoz(); if(!vozActiva)return;
  cantaEl.classList.add('hablando'); cantaEl.textContent=' '+CARTAS[num];
  const a=new Audio(RUTA_AUDIOS+num+".mp3");
  let usoTTS=false;
  const tts=()=>{ if(usoTTS||!synth){fin();return} usoTTS=true;
    const u=new SpeechSynthesisUtterance("¡"+CARTAS[num]+"!");
    u.lang="es-MX"; if(vozES)u.voice=vozES; u.rate=.85; u.pitch=1.25;
    u.onend=u.onerror=fin; synth.speak(u); };
  a.onerror=tts; a.onended=fin;
  a.play().catch(tts); audioActual=a;
}
function detenerVoz(){ if(audioActual){audioActual.pause();audioActual=null} if(synth)synth.cancel(); fin(); }

/* ===== CONFIGURACIÓN ===== */
const selTablas=document.getElementById('selectorTablas');
Object.keys(TABLAS).forEach(n=>{
  const b=document.createElement('button'); b.className='opt'+(n===tablaSel?' sel':'');
  b.innerHTML='<img src="'+RUTA_TABLAS+n+'.png" alt="" loading="lazy" onerror="this.style.display=\'none\'">Tabla '+n;
  b.onclick=()=>{tablaSel=n;selTablas.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));b.classList.add('sel')};
  selTablas.appendChild(b);
});
document.querySelectorAll('#modos .opt').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#modos .opt').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');modo=b.dataset.modo});
function setVoz(on){vozActiva=on;document.getElementById('vozOn').classList.toggle('sel',on);document.getElementById('vozOff').classList.toggle('sel',!on);
  const bv=document.getElementById('btnVoz');bv.textContent=on?'🔊':'🔇';bv.setAttribute('aria-pressed',on);if(!on)detenerVoz()}
document.getElementById('vozOn').onclick=()=>setVoz(true);
document.getElementById('vozOff').onclick=()=>setVoz(false);
document.getElementById('btnVoz').onclick=()=>setVoz(!vozActiva);

/* ===== PARTIDA ===== */
const $=id=>document.getElementById(id);
function iniciar(){
  activo=true; mazo=Object.keys(CARTAS); salidas=[]; marcadas=new Set(); ultima=null; parar();
  $('configuracion').style.display='none'; $('juego').style.display='block';
  $('tituloTabla').textContent='Tabla '+tablaSel; $('hudTabla').textContent='TABLA '+tablaSel;
  $('historial').innerHTML=''; $('cartaActual').innerHTML='<div class="vacio">🎴</div><div>Pulsa <b>Sacar carta</b></div>';
  cargarTabla(); contar(); btnAutoTxt();
}
function cargarTabla(){
  const img=$('imagenTabla'); img.src=RUTA_TABLAS+tablaSel+'.png';
  const g=$('grid'); g.innerHTML='';
  TABLAS[tablaSel].forEach((fila,f)=>fila.forEach((n,c)=>{
    const b=document.createElement('button'); b.className='casilla'; b.dataset.n=n; b.dataset.k=f+'-'+c;
    b.setAttribute('aria-label',CARTAS[n]); b.onclick=()=>marcar(b); g.appendChild(b);
  }));
}
function marcar(b){
  const k=b.dataset.k, n=b.dataset.n;
  if(marcadas.has(k)){marcadas.delete(k);b.innerHTML='';return}
  if(!salidas.includes(n)){aviso('⚠ Esa carta todavía no sale');return}
  marcadas.add(k);
  const im=document.createElement('img'); im.className='frijol'; im.alt='';
  im.src=FRIJOL; im.onerror=()=>{im.remove();const e=document.createElement('div');e.className='frijol-e';e.textContent='🫘';b.appendChild(e)};
  b.appendChild(im); revisar();
}
let avT; function aviso(t){const a=$('aviso');a.textContent=t;clearTimeout(avT);avT=setTimeout(()=>a.textContent='',1800)}
function sacar(){
  if(!activo)return;
  if(!mazo.length){parar();aviso('Ya salieron las 54 cartas');return}
  const n=mazo.splice(Math.floor(Math.random()*mazo.length),1)[0];
  salidas.push(n); ultima=n; mostrar(n); hablar(n);
  const h=document.createElement('div'); h.className='hi'; h.textContent=n+' '+CARTAS[n]; $('historial').prepend(h);
  contar(); pistas();
}
function mostrar(n){
  $('cartaActual').innerHTML='<img src="'+RUTA_CARTAS+n+'.png" alt="'+CARTAS[n]+'" onerror="this.outerHTML=\'<div class=vacio>🎴</div>\'">'+
   '<div class="carta-nombre">'+CARTAS[n]+'</div><div class="carta-num">Carta '+n+'</div>';
}
function pistas(){ // resalta casillas que ya puedes marcar
  document.querySelectorAll('.casilla').forEach(c=>c.classList.toggle('pista',c.dataset.n===ultima&&!marcadas.has(c.dataset.k)));
}
function contar(){$('contador').textContent=salidas.length;$('progreso').style.width=(salidas.length/54*100)+'%'}
function btnAutoTxt(){$('btnAuto').textContent=timer?'⏸ Pausar':'▶ Automático'}
function auto(){
  if(timer){parar();return}
  sacar(); timer=setInterval(sacar,$('velocidad').value*1000); btnAutoTxt();
}
function parar(){clearInterval(timer);timer=null;btnAutoTxt()}
$('velocidad').oninput=()=>{if(timer){clearInterval(timer);timer=setInterval(sacar,$('velocidad').value*1000)}};

/* ===== GANAR ===== */
function revisar(){
  const m=(f,c)=>marcadas.has(f+'-'+c); let ok=false,t='';
  if(modo==='llena'&&marcadas.size===16){ok=true;t='¡Llenaste toda la tabla!'}
  if(modo==='cinco'&&marcadas.size>=5){ok=true;t='¡Juntaste cinco frijoles!'}
  if(modo==='horizontal')for(let f=0;f<4;f++)if([0,1,2,3].every(c=>m(f,c))){ok=true;t='¡Línea horizontal completa!'}
  if(modo==='vertical')for(let c=0;c<4;c++)if([0,1,2,3].every(f=>m(f,c))){ok=true;t='¡Línea vertical completa!'}
  if(modo==='diagonal'&&([0,1,2,3].every(i=>m(i,i))||[0,1,2,3].every(i=>m(i,3-i)))){ok=true;t='¡Esquina a esquina!'}
  if(ok)ganar(t);
}
function ganar(t){
  parar(); detenerVoz(); $('textoGanador').textContent=t; $('ganador').style.display='flex';
  if(vozActiva&&synth){const u=new SpeechSynthesisUtterance('¡Lotería!');u.lang='es-MX';if(vozES)u.voice=vozES;u.pitch=1.3;synth.speak(u)}
  const cols=['#ffd23f','#e84a5f','#2f7d4f','#f08a4b','#fff3d6'];
  for(let i=0;i<50;i++){const d=document.createElement('i');d.className='confeti';d.style.left=Math.random()*100+'vw';
    d.style.background=cols[i%5];d.style.animationDuration=(2+Math.random()*2)+'s';d.style.animationDelay=Math.random()*.6+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
}
$('btnCerrar').onclick=()=>$('ganador').style.display='none';
$('btnComenzar').onclick=iniciar;
$('btnSacar').onclick=sacar;
$('btnAuto').onclick=auto;
$('btnRepetir').onclick=()=>{if(ultima)hablar(ultima)};
$('btnNueva').onclick=()=>{parar();detenerVoz();activo=false;$('juego').style.display='none';$('configuracion').style.display='block';window.scrollTo(0,0)};
/* Permite que el mapa pause el juego al cerrar la ventana */
window.addEventListener('message',e=>{if(e.data==='pausa'){parar();detenerVoz()}});
</script>
