
<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Lotería</title>


<style>

/* ============================================================
   VARIABLES
   ============================================================ */

:root {

    --cafe:
        #4b260f;

    --cafe-claro:
        #7b4a24;

    --dorado:
        #c69a45;

    --crema:
        #fff8e5;

    --crema-2:
        #f2dfb1;

    --rojo:
        #8b2c20;

    --rojo-oscuro:
        #641b13;

}


/* ============================================================
   GENERAL
   ============================================================ */

* {

    box-sizing:
        border-box;

}


body {

    margin:
        0;

    min-height:
        100vh;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color:
        var(--cafe);

    background:

        radial-gradient(
            circle at 50% -10%,
            #fffdf4 0%,
            #f8eac3 40%,
            #e7ce93 100%
        );

}


/* ============================================================
   ENCABEZADO
   ============================================================ */

.header {

    text-align:
        center;

    padding:
        18px 10px 5px;

}


.header h1 {

    margin:
        0;

    font-size:
        clamp(38px, 5vw, 70px);

    letter-spacing:
        5px;

    color:
        #4b250c;

    text-shadow:
        2px 2px 0 #d8b36a;

}


.header p {

    margin:
        3px 0 10px;

    font-size:
        18px;

}


/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

#configuracion {

    width:
        min(1000px, 94vw);

    margin:
        20px auto 40px;

    padding:
        30px;

    background:
        rgba(255,255,255,.76);

    border:
        2px solid var(--cafe-claro);

    border-radius:
        18px;

    box-shadow:
        0 12px 35px rgba(60,30,10,.18);

}


.seccion {

    margin-bottom:
        25px;

}


.seccion h2 {

    margin-top:
        0;

    font-size:
        24px;

}


.selector-tablas {

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(130px, 1fr)
        );

    gap:
        10px;

}


.tabla-btn,
.modo-btn {

    border:
        2px solid var(--cafe-claro);

    background:
        var(--crema-2);

    color:
        var(--cafe);

    padding:
        13px;

    border-radius:
        10px;

    font-family:
        inherit;

    font-size:
        16px;

    cursor:
        pointer;

    transition:
        .2s;

}


.tabla-btn:hover,
.modo-btn:hover {

    transform:
        translateY(-2px);

    background:
        #e7c986;

}


.tabla-btn.seleccionado,
.modo-btn.seleccionado {

    background:
        var(--rojo);

    color:
        white;

    border-color:
        var(--rojo-oscuro);

    box-shadow:
        0 4px 12px
        rgba(0,0,0,.25);

}


.modos {

    display:
        grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(190px, 1fr)
        );

    gap:
        10px;

}


.btn-principal {

    display:
        block;

    width:
        100%;

    padding:
        16px;

    border:
        none;

    border-radius:
        12px;

    background:
        var(--rojo);

    color:
        white;

    font-family:
        inherit;

    font-size:
        21px;

    font-weight:
        bold;

    cursor:
        pointer;

    transition:
        .2s;

}


.btn-principal:hover {

    background:
        #a33a2b;

    transform:
        translateY(-2px);

}


/* ============================================================
   JUEGO
   ============================================================ */

#juego {

    display:
        none;

    width:
        min(1500px, 98vw);

    margin:
        0 auto;

    padding:
        10px 15px 30px;

}


.layout {

    display:
        grid;

    grid-template-columns:
        minmax(230px, 300px)
        minmax(450px, 1fr)
        minmax(230px, 300px);

    gap:
        22px;

    align-items:
        start;

}


/* ============================================================
   PANELES
   ============================================================ */

.panel {

    background:
        rgba(255,255,255,.78);

    border:
        2px solid var(--cafe-claro);

    border-radius:
        18px;

    box-shadow:
        0 8px 25px rgba(60,30,10,.14);

}


/* ============================================================
   CARTA ACTUAL
   ============================================================ */

.panel-carta {

    padding:
        18px;

    text-align:
        center;

    position:
        sticky;

    top:
        15px;

}


.panel-carta h2 {

    margin:
        0 0 10px;

    font-size:
        25px;

}


.carta-actual {

    min-height:
        430px;

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;

}


.carta-actual img {

    display:
        block;

    width:
        100%;

    max-width:
        250px;

    max-height:
        340px;

    object-fit:
        contain;

    border-radius:
        8px;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.28);

    animation:
        aparecer .35s ease;

}


.carta-nombre {

    margin-top:
        12px;

    font-size:
        23px;

    font-weight:
        bold;

}


.carta-numero {

    margin-top:
        3px;

    font-size:
        14px;

    opacity:
        .7;

}


@keyframes aparecer {

    from {

        opacity:
            0;

        transform:
            scale(.75)
            rotate(-3deg);

    }

    to {

        opacity:
            1;

        transform:
            scale(1)
            rotate(0);

    }

}


/* ============================================================
   TABLA
   ============================================================ */

.panel-tabla {

    text-align:
        center;

}


.panel-tabla h2 {

    margin:
        0 0 12px;

    font-size:
        30px;

}


.tabla-container {

    position:
        relative;

    width:
        min(100%, 700px);

    margin:
        0 auto;

    line-height:
        0;

    border-radius:
        10px;

    overflow:
        hidden;

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.30);

    background:
        white;

}


.tabla-imagen {

    display:
        block;

    width:
        100%;

    height:
        auto;

}


.grid {

    position:
        absolute;

    inset:
        0;

    display:
        grid;

    grid-template-columns:
        repeat(4, 1fr);

    grid-template-rows:
        repeat(4, 1fr);

}


.casilla {

    position:
        relative;

    cursor:
        pointer;

    transition:
        background .15s;

}


.casilla:hover {

    background:
        rgba(255,255,255,.15);

}


.casilla.bloqueada {

    cursor:
        not-allowed;

}


.casilla.bloqueada:hover {

    background:
        rgba(255,0,0,.10);

}


/* ============================================================
   FRIJOL
   ============================================================ */

.frijol {

    position:
        absolute;

    width:
        62%;

    height:
        62%;

    left:
        19%;

    top:
        19%;

    object-fit:
        contain;

    pointer-events:
        none;

    filter:
        drop-shadow(
            2px 3px 3px
            rgba(0,0,0,.55)
        );

    animation:
        colocarFrijol .2s ease;

}


.frijol-emoji {

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%, -50%);

    font-size:
        clamp(30px, 5vw, 55px);

    pointer-events:
        none;

    filter:
        drop-shadow(
            2px 3px 2px
            rgba(0,0,0,.45)
        );

}


@keyframes colocarFrijol {

    from {

        opacity:
            0;

        transform:
            scale(.3);

    }

    to {

        opacity:
            1;

        transform:
            scale(1);

    }

}


/* ============================================================
   CONTROLES
   ============================================================ */

.panel-control {

    padding:
        18px;

    position:
        sticky;

    top:
        15px;

}


.panel-control h3 {

    margin:
        0 0 14px;

    font-size:
        23px;

}


.contador {

    text-align:
        center;

    font-size:
        30px;

    font-weight:
        bold;

    margin:
        10px 0 18px;

}


.control-btn {

    width:
        100%;

    margin-bottom:
        10px;

    padding:
        13px;

    border-radius:
        9px;

    border:
        1px solid var(--cafe-claro);

    background:
        var(--crema-2);

    color:
        var(--cafe);

    font-family:
        inherit;

    font-size:
        16px;

    cursor:
        pointer;

    transition:
        .2s;

}


.control-btn:hover {

    background:
        #e7c986;

    transform:
        translateY(-1px);

}


.control-btn.activo {

    background:
        var(--rojo);

    color:
        white;

}


/* ============================================================
   HISTORIAL
   ============================================================ */

.historial {

    max-height:
        330px;

    overflow-y:
        auto;

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        6px;

}


.historial-item {

    padding:
        7px 9px;

    background:
        var(--crema-2);

    border:
        1px solid #d0ad62;

    border-radius:
        7px;

    font-size:
        13px;

}


/* ============================================================
   MENSAJES
   ============================================================ */

.instruccion {

    margin:
        10px auto 15px;

    padding:
        9px 14px;

    width:
        fit-content;

    max-width:
        90%;

    background:
        rgba(255,255,255,.75);

    border-radius:
        20px;

    font-size:
        14px;

}


.aviso {

    padding:
        10px;

    margin-bottom:
        12px;

    border-radius:
        8px;

    background:
        #fff0c2;

    border:
        1px solid #d4aa55;

    font-size:
        14px;

}


/* ============================================================
   GANADOR
   ============================================================ */

#mensajeGanador {

    display:
        none;

    position:
        fixed;

    inset:
        0;

    background:
        rgba(0,0,0,.72);

    z-index:
        1000;

    align-items:
        center;

    justify-content:
        center;

}


.ganador-box {

    background:
        var(--crema);

    border:
        4px solid #9d722b;

    border-radius:
        25px;

    padding:
        40px;

    text-align:
        center;

    width:
        min(90%, 550px);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.5);

    animation:
        ganador .4s ease;

}


.ganador-box h2 {

    font-size:
        48px;

    margin:
        0 0 10px;

    color:
        var(--rojo);

}


.ganador-box p {

    font-size:
        21px;

}


@keyframes ganador {

    from {

        opacity:
            0;

        transform:
            scale(.5);

    }

    to {

        opacity:
            1;

        transform:
            scale(1);

    }

}


/* ============================================================
   RESPONSIVE
   ============================================================ */

@media(max-width: 1050px) {

    .layout {

        grid-template-columns:
            1fr;

    }


    .panel-carta,
    .panel-control {

        position:
            relative;

        top:
            0;

    }


    .panel-carta {

        order:
            1;

    }


    .panel-tabla {

        order:
            2;

    }


    .panel-control {

        order:
            3;

    }


    .carta-actual {

        min-height:
            350px;

    }

}


@media(max-width: 600px) {

    #juego {

        padding:
            5px;

    }


    .tabla-container {

        width:
            96vw;

    }


    .header h1 {

        letter-spacing:
            2px;

    }

}

</style>

</head>


<body>


<!-- ============================================================
     ENCABEZADO
     ============================================================ -->

<header class="header">

    <h1>LOTERÍA</h1>

    <p>Juego tradicional</p>

</header>


<!-- ============================================================
     CONFIGURACIÓN
     ============================================================ -->

<section id="configuracion">


    <div class="seccion">

        <h2>
            1. Selecciona tu tabla
        </h2>


        <div
            class="selector-tablas"
            id="selectorTablas">
        </div>

    </div>



    <div class="seccion">

        <h2>
            2. Selecciona el modo de juego
        </h2>


        <div class="modos">


            <button
                class="modo-btn seleccionado"
                data-modo="llena">

                🏆 Tabla llena

            </button>


            <button
                class="modo-btn"
                data-modo="horizontal">

                ━ Línea horizontal

            </button>


            <button
                class="modo-btn"
                data-modo="vertical">

                ┃ Línea vertical

            </button>


            <button
                class="modo-btn"
                data-modo="diagonal">

                ╲ Esquina a esquina

            </button>


            <button
                class="modo-btn"
                data-modo="cinco">

                🫘 5 de oros

            </button>


        </div>

    </div>


    <button
        class="btn-principal"
        onclick="iniciarJuego()">

        🎴 COMENZAR PARTIDA

    </button>


</section>



<!-- ============================================================
     JUEGO
     ============================================================ -->

<section id="juego">


    <div class="layout">


        <!-- ====================================================
             CARTA
             ==================================================== -->

        <aside class="panel panel-carta">


            <h2>
                🎴 Carta actual
            </h2>


            <div
                class="carta-actual"
                id="cartaActual">


                <div
                    style="
                        font-size:70px;
                        opacity:.5;
                    ">

                    🎴

                </div>


                <div>

                    Presiona
                    <b>Sacar carta</b>

                </div>


            </div>


        </aside>



        <!-- ====================================================
             TABLA
             ==================================================== -->

        <main class="panel panel-tabla">


            <h2 id="tituloTabla">
                Tabla 01
            </h2>


            <div class="instruccion">

                Las casillas se pueden marcar
                únicamente cuando la carta haya salido.

            </div>


            <div class="tabla-container">


                <img
                    id="imagenTabla"
                    class="tabla-imagen"
                    src=""
                    alt="Tabla de lotería"
                >


                <div
                    class="grid"
                    id="grid">
                </div>


            </div>


        </main>



        <!-- ====================================================
             CONTROLES
             ==================================================== -->

        <aside class="panel panel-control">


            <h3>
                🎮 Controles
            </h3>


            <div class="contador">

                <span id="contador">
                    0
                </span>

                / 54

            </div>


            <button
                class="control-btn"
                onclick="sacarCarta()">

                🎴 Sacar carta

            </button>


            <button
                class="control-btn"
                onclick="iniciarAutomatico()">

                ▶ Iniciar automático

            </button>


            <button
                class="control-btn"
                onclick="detenerAutomatico()">

                ⏸ Pausar

            </button>


            <button
                class="control-btn"
                onclick="reiniciarJuego()">

                🔄 Nueva partida

            </button>


            <h3 style="margin-top:20px;">

                Cartas salidas

            </h3>


            <div
                class="historial"
                id="historial">
            </div>


        </aside>


    </div>


</section>



<!-- ============================================================
     GANADOR
     ============================================================ -->

<div id="mensajeGanador">


    <div class="ganador-box">


        <h2>
            ¡LOTERÍA!
        </h2>


        <p id="textoGanador">
            ¡Has ganado!
        </p>


        <button
            class="btn-principal"
            onclick="cerrarGanador()">

            Continuar

        </button>


    </div>


</div>



<script>


// ============================================================
// DATOS
// ============================================================

const CARTAS =
    {"01": "La tortilla", "02": "La tortilla azul", "03": "El azadón", "04": "El metate", "05": "La aguja", "06": "La petaca", "07": "El metapil", "08": "El comal", "09": "El cuchillo", "10": "El chile", "11": "El costal", "12": "Las tunas", "13": "El sombrero", "14": "Las tijeras", "15": "La barreta", "16": "La enfrijolada", "17": "El guachichil", "18": "El huipil", "19": "El pico", "20": "La frazada", "21": "La plata", "22": "El gran tunal", "23": "Los zapatos", "24": "El pinole", "25": "El preparado", "26": "El novillo", "27": "El oro", "28": "El atole", "29": "El almagre", "30": "El piloncillo", "31": "El escoplo", "32": "Los escamoles", "33": "El pulque", "34": "El arco", "35": "Las telas", "36": "El mapa", "37": "El mezcal", "38": "Los frijoles", "39": "El chuzo", "40": "El peyote", "41": "El venado", "42": "El nativo", "43": "El mezquite", "44": "El huizache", "45": "La mula", "46": "El jorongo", "47": "El garambullo", "48": "El colonche", "49": "El aguamiel", "50": "La biznaga", "51": "La cardona", "52": "La damburita", "53": "El petate", "54": "El mitote"};


const TABLAS =
    {"01": [["49", "52", "46", "44"], ["22", "51", "35", "11"], ["27", "33", "25", "08"], ["53", "40", "47", "28"]], "02": [["40", "36", "29", "07"], ["24", "42", "44", "13"], ["33", "19", "54", "47"], ["16", "21", "12", "38"]], "03": [["10", "39", "20", "16"], ["53", "06", "04", "19"], ["01", "14", "43", "13"], ["52", "51", "32", "23"]], "04": [["28", "08", "19", "11"], ["36", "10", "02", "51"], ["16", "34", "26", "38"], ["41", "13", "44", "17"]], "05": [["15", "05", "07", "39"], ["28", "01", "18", "06"], ["25", "12", "31", "03"], ["29", "41", "49", "27"]], "06": [["30", "47", "03", "45"], ["11", "44", "23", "18"], ["37", "48", "08", "32"], ["43", "01", "16", "50"]], "07": [["37", "42", "29", "02"], ["12", "24", "17", "33"], ["31", "54", "48", "35"], ["46", "09", "15", "25"]], "08": [["44", "32", "22", "06"], ["45", "15", "26", "34"], ["17", "40", "09", "05"], ["30", "14", "21", "50"]], "09": [["36", "52", "07", "39"], ["17", "12", "54", "30"], ["14", "42", "26", "51"], ["18", "41", "21", "25"]], "10": [["30", "17", "40", "20"], ["32", "01", "39", "42"], ["08", "22", "52", "05"], ["27", "41", "10", "26"]]};


// ============================================================
// VARIABLES
// ============================================================

let tablaSeleccionada =
    "01";


let modoSeleccionado =
    "llena";


let cartasDisponibles =
    [];


let cartasSalidas =
    [];


let marcadas =
    new Set();


let intervaloAutomatico =
    null;


let juegoActivo =
    false;


// ============================================================
// SELECTOR DE TABLAS
// ============================================================

function cargarSelectorTablas() {


    const contenedor =
        document.getElementById(
            "selectorTablas"
        );


    contenedor.innerHTML =
        "";


    Object.keys(TABLAS)
        .forEach(numero => {


            const boton =
                document.createElement(
                    "button"
                );


            boton.className =
                "tabla-btn";


            if (
                numero ===
                tablaSeleccionada
            ) {

                boton.classList.add(
                    "seleccionado"
                );

            }


            boton.textContent =
                "Tabla " +
                numero;


            boton.onclick =
                () => {


                    tablaSeleccionada =
                        numero;


                    document
                        .querySelectorAll(
                            ".tabla-btn"
                        )
                        .forEach(
                            b =>
                                b.classList
                                .remove(
                                    "seleccionado"
                                )
                        );


                    boton.classList.add(
                        "seleccionado"
                    );


                };


            contenedor.appendChild(
                boton
            );


        });


}


// ============================================================
// SELECTOR DE MODOS
// ============================================================

document
    .querySelectorAll(
        ".modo-btn"
    )
    .forEach(
        boton => {


            boton.addEventListener(
                "click",
                () => {


                    document
                        .querySelectorAll(
                            ".modo-btn"
                        )
                        .forEach(
                            b =>
                                b.classList
                                .remove(
                                    "seleccionado"
                                )
                        );


                    boton.classList.add(
                        "seleccionado"
                    );


                    modoSeleccionado =
                        boton.dataset.modo;


                }
            );


        }
    );


// ============================================================
// INICIAR JUEGO
// ============================================================

function iniciarJuego() {


    juegoActivo =
        true;


    cartasDisponibles =
        Object.keys(CARTAS);


    cartasSalidas =
        [];


    marcadas =
        new Set();


    detenerAutomatico();


    document
        .getElementById(
            "configuracion"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "juego"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "tituloTabla"
        )
        .textContent =
        "Tabla " +
        tablaSeleccionada;


    cargarTabla();


    actualizarContador();


    document
        .getElementById(
            "historial"
        )
        .innerHTML =
        "";


    document
        .getElementById(
            "cartaActual"
        )
        .innerHTML = `

            <div
                style="
                    font-size:70px;
                    opacity:.5;
                ">

                🎴

            </div>

            <div>

                Presiona
                <b>Sacar carta</b>

            </div>

        `;

}


// ============================================================
// CARGAR TABLA
// ============================================================

function cargarTabla() {


    const imagen =
        document.getElementById(
            "imagenTabla"
        );


    imagen.src =
        "tablas/" +
        tablaSeleccionada +
        ".png";


    imagen.onerror =
        function() {


            console.error(
                "No se pudo cargar:",
                imagen.src
            );


        };


    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML =
        "";


    const tabla =
        TABLAS[
            tablaSeleccionada
        ];


    tabla.forEach(
        (fila, filaIndex) => {


            fila.forEach(
                (numero, columnaIndex) => {


                    const casilla =
                        document.createElement(
                            "div"
                        );


                    casilla.className =
                        "casilla";


                    casilla.dataset.numero =
                        numero;


                    casilla.dataset.fila =
                        filaIndex;


                    casilla.dataset.columna =
                        columnaIndex;


                    casilla.onclick =
                        () => {


                            marcarCasilla(
                                casilla
                            );


                        };


                    grid.appendChild(
                        casilla
                    );


                }
            );


        }
    );


}


// ============================================================
// MARCAR CASILLA
// ============================================================

function marcarCasilla(
    casilla
) {


    const numero =
        casilla.dataset.numero;


    const fila =
        casilla.dataset.fila;


    const columna =
        casilla.dataset.columna;


    const clave =
        fila +
        "-" +
        columna;


    // --------------------------------------------------------
    // SI YA ESTÁ MARCADA
    // --------------------------------------------------------

    if (
        marcadas.has(clave)
    ) {


        marcadas.delete(
            clave
        );


        casilla.innerHTML =
            "";


        return;

    }


    // --------------------------------------------------------
    // LA CARTA DEBE HABER SALIDO
    // --------------------------------------------------------

    if (
        !cartasSalidas.includes(
            numero
        )
    ) {


        mostrarAviso(
            "⚠️ Esta carta todavía no ha salido."
        );


        return;

    }


    // --------------------------------------------------------
    // MARCAR
    // --------------------------------------------------------

    marcadas.add(
        clave
    );


    const imagenFrijol =
        document.createElement(
            "img"
        );


    imagenFrijol.className =
        "frijol";


    imagenFrijol.src =
        "frijol.png";


    imagenFrijol.onerror =
        function() {


            this.style.display =
                "none";


            const emoji =
                document.createElement(
                    "div"
                );


            emoji.className =
                "frijol-emoji";


            emoji.textContent =
                "🫘";


            casilla.appendChild(
                emoji
            );


        };


    casilla.appendChild(
        imagenFrijol
    );


    comprobarGanador();

}


// ============================================================
// AVISO
// ============================================================

function mostrarAviso(
    mensaje
) {


    const viejo =
        document.getElementById(
            "avisoTemporal"
        );


    if (viejo) {

        viejo.remove();

    }


    const aviso =
        document.createElement(
            "div"
        );


    aviso.id =
        "avisoTemporal";


    aviso.className =
        "aviso";


    aviso.textContent =
        mensaje;


    const panel =
        document.querySelector(
            ".panel-tabla"
        );


    panel.insertBefore(
        aviso,
        panel.querySelector(
            ".tabla-container"
        )
    );


    setTimeout(
        () => {

            aviso.remove();

        },
        1800
    );

}


// ============================================================
// SACAR CARTA
// ============================================================

function sacarCarta() {


    if (
        !juegoActivo
    ) {

        return;

    }


    if (
        cartasDisponibles.length === 0
    ) {


        detenerAutomatico();


        mostrarAviso(
            "Ya salieron las 54 cartas."
        );


        return;

    }


    // --------------------------------------------------------
    // ELEGIR CARTA ALEATORIA
    // --------------------------------------------------------

    const indice =
        Math.floor(
            Math.random() *
            cartasDisponibles.length
        );


    const numero =
        cartasDisponibles.splice(
            indice,
            1
        )[0];


    cartasSalidas.push(
        numero
    );


    mostrarCarta(
        numero
    );


    agregarHistorial(
        numero
    );


    actualizarContador();


}


// ============================================================
// MOSTRAR CARTA
// ============================================================

function mostrarCarta(
    numero
) {


    const contenedor =
        document.getElementById(
            "cartaActual"
        );


    const nombre =
        CARTAS[
            numero
        ];


    contenedor.innerHTML = `

        <img
            src="cartas/${numero}.png"
            alt="${nombre}"
        >

        <div class="carta-nombre">

            ${nombre}

        </div>

        <div class="carta-numero">

            Carta ${numero}

        </div>

    `;


}


// ============================================================
// HISTORIAL
// ============================================================

function agregarHistorial(
    numero
) {


    const historial =
        document.getElementById(
            "historial"
        );


    const elemento =
        document.createElement(
            "div"
        );


    elemento.className =
        "historial-item";


    elemento.textContent =
        numero +
        " · " +
        CARTAS[numero];


    historial.prepend(
        elemento
    );

}


// ============================================================
// CONTADOR
// ============================================================

function actualizarContador() {


    document
        .getElementById(
            "contador"
        )
        .textContent =
        cartasSalidas.length;


}


// ============================================================
// MODO AUTOMÁTICO
// ============================================================

function iniciarAutomatico() {


    if (
        !juegoActivo
    ) {

        return;

    }


    detenerAutomatico();


    sacarCarta();


    intervaloAutomatico =
        setInterval(
            () => {

                sacarCarta();

            },
            3000
        );

}


function detenerAutomatico() {


    if (
        intervaloAutomatico !== null
    ) {


        clearInterval(
            intervaloAutomatico
        );


        intervaloAutomatico =
            null;

    }

}


// ============================================================
// COMPROBAR GANADOR
// ============================================================

function comprobarGanador() {


    // --------------------------------------------------------
    // TABLA LLENA
    // --------------------------------------------------------

    if (
        modoSeleccionado ===
        "llena"
    ) {


        if (
            marcadas.size === 16
        ) {


            mostrarGanador(
                "¡Completaste toda la tabla!"
            );


            return;

        }

    }


    // --------------------------------------------------------
    // HORIZONTAL
    // --------------------------------------------------------

    if (
        modoSeleccionado ===
        "horizontal"
    ) {


        for (
            let fila = 0;
            fila < 4;
            fila++
        ) {


            let completa =
                true;


            for (
                let columna = 0;
                columna < 4;
                columna++
            ) {


                if (
                    !marcadas.has(
                        fila +
                        "-" +
                        columna
                    )
                ) {


                    completa =
                        false;


                }

            }


            if (
                completa
            ) {


                mostrarGanador(
                    "¡Completaste una línea horizontal!"
                );


                return;

            }

        }

    }


    // --------------------------------------------------------
    // VERTICAL
    // --------------------------------------------------------

    if (
        modoSeleccionado ===
        "vertical"
    ) {


        for (
            let columna = 0;
            columna < 4;
            columna++
        ) {


            let completa =
                true;


            for (
                let fila = 0;
                fila < 4;
                fila++
            ) {


                if (
                    !marcadas.has(
                        fila +
                        "-" +
                        columna
                    )
                ) {


                    completa =
                        false;


                }

            }


            if (
                completa
            ) {


                mostrarGanador(
                    "¡Completaste una línea vertical!"
                );


                return;

            }

        }

    }


    // --------------------------------------------------------
    // DIAGONAL
    // --------------------------------------------------------

    if (
        modoSeleccionado ===
        "diagonal"
    ) {


        let diagonal1 =
            true;


        let diagonal2 =
            true;


        for (
            let i = 0;
            i < 4;
            i++
        ) {


            if (
                !marcadas.has(
                    i +
                    "-" +
                    i
                )
            ) {


                diagonal1 =
                    false;

            }


            if (
                !marcadas.has(
                    i +
                    "-" +
                    (3 - i)
                )
            ) {


                diagonal2 =
                    false;

            }

        }


        if (
            diagonal1 ||
            diagonal2
        ) {


            mostrarGanador(
                "¡Completaste una diagonal!"
            );


            return;

        }

    }


    // --------------------------------------------------------
    // 5 DE OROS
    // --------------------------------------------------------

    if (
        modoSeleccionado ===
        "cinco"
    ) {


        if (
            marcadas.size >= 5
        ) {


            mostrarGanador(
                "¡Completaste 5 de oros!"
            );


            return;

        }

    }

}


// ============================================================
// MOSTRAR GANADOR
// ============================================================

function mostrarGanador(
    texto
) {


    detenerAutomatico();


    document
        .getElementById(
            "textoGanador"
        )
        .textContent =
        texto;


    document
        .getElementById(
            "mensajeGanador"
        )
        .style.display =
        "flex";


}


// ============================================================
// CERRAR GANADOR
// ============================================================

function cerrarGanador() {


    document
        .getElementById(
            "mensajeGanador"
        )
        .style.display =
        "none";


}


// ============================================================
// NUEVA PARTIDA
// ============================================================

function reiniciarJuego() {


    detenerAutomatico();


    juegoActivo =
        false;


    document
        .getElementById(
            "juego"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "configuracion"
        )
        .style.display =
        "block";


}


// ============================================================
// INICIALIZAR
// ============================================================

cargarSelectorTablas();

</script>
